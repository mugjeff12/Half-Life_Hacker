name: Build executables

# Push this folder to a GitHub repo, then:  Actions → "Build executables" → Run workflow
# (or push a tag like v1.0.0).  Download the Windows / macOS / Linux zips from the run's "Artifacts".
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows }
          - { os: macos-latest,   label: macOS }          # Apple Silicon (M1/M2/M3/M4) Macs
          - { os: macos-15-intel, label: macOS-Intel }    # older Intel Macs
          - { os: ubuntu-latest,  label: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 fonts-dejavu-core
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Build and self-test the executable
        run: python build.py --test
      - uses: actions/upload-artifact@v4
        with:
          name: HalfLifeHacker-${{ matrix.label }}
          path: dist/HalfLifeHacker-*.zip
